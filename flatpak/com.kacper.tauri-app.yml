app-id: com.kacper.tauri-app
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: tauri-app
finish-args:
  - --device=dri
  - --device=all
  - --share=ipc
  - --share=network
  - --filesystem=/run/udev:ro
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=com.valvesoftware.Steam

modules:
  - name: romm-launcher
    buildsystem: simple
    build-commands:
      - ar x romm-launcher.deb
      - |
        if [ -f data.tar.xz ]; then
          tar -xf data.tar.xz
        elif [ -f data.tar.gz ]; then
          tar -xf data.tar.gz
        elif [ -f data.tar.zst ]; then
          tar --use-compress-program=unzstd -xf data.tar.zst
        else
          echo "Unsupported Debian archive payload."
          exit 1
        fi
      - cp -a usr/. /app/
      - rm -f /app/share/applications/*.desktop
      - install -Dm644 com.kacper.tauri-app.desktop /app/share/applications/com.kacper.tauri-app.desktop
      - install -Dm644 com.kacper.tauri-app.metainfo.xml /app/share/metainfo/com.kacper.tauri-app.metainfo.xml
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/com.kacper.tauri-app.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/com.kacper.tauri-app.png
      - install -Dm644 256x256.png /app/share/icons/hicolor/256x256/apps/com.kacper.tauri-app.png
      - install -Dm644 512x512.png /app/share/icons/hicolor/512x512/apps/com.kacper.tauri-app.png
    sources:
      - type: file
        path: ../src-tauri/target/release/bundle/flatpak-input/romm-launcher.deb
        dest-filename: romm-launcher.deb
      - type: file
        path: com.kacper.tauri-app.desktop
      - type: file
        path: com.kacper.tauri-app.metainfo.xml
      - type: file
        path: ../src-tauri/icons/32x32.png
      - type: file
        path: ../src-tauri/icons/128x128.png
      - type: file
        path: ../src-tauri/icons/128x128@2x.png
        dest-filename: 256x256.png
      - type: file
        path: ../src-tauri/icons/icon.png
        dest-filename: 512x512.png
