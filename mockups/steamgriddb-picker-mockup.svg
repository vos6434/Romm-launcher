<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="SteamGridDB in-app visual picker mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="50%" stop-color="#0a1a2f"/>
      <stop offset="100%" stop-color="#12121b"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="80%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; letter-spacing: 0.04em; }
      .subtitle { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #9ca3af; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #d1d5db; }
      .tiny { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .buttonText { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .hintText { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .badgeText { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .cardText { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glowBlue)"/>
  <rect width="1600" height="1000" fill="url(#glowAmber)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="70" width="1420" height="860" rx="22" fill="url(#panel)" stroke="#1f2937"/>
  </g>

  <!-- Top bar -->
  <rect x="110" y="90" width="1380" height="74" rx="14" fill="#0f172a" stroke="#1f2937"/>
  <text x="138" y="136" class="title">SteamGridDB Picker</text>
  <text x="432" y="136" class="subtitle">Super Mario Bros.</text>
  <rect x="1170" y="112" width="112" height="28" rx="14" fill="#22d3ee"/>
  <text x="1204" y="131" class="badgeText">BACKGROUND</text>
  <rect x="1310" y="112" width="80" height="28" rx="8" fill="#111827" stroke="#334155"/>
  <text x="1338" y="131" class="buttonText">Close</text>

  <!-- Left rail -->
  <rect x="110" y="180" width="280" height="670" rx="14" fill="#0b1220" stroke="#1f2937"/>
  <text x="134" y="214" class="label">Source</text>
  <rect x="134" y="228" width="112" height="32" rx="8" fill="#0ea5e9"/>
  <text x="170" y="249" class="buttonText">Game</text>
  <rect x="256" y="228" width="112" height="32" rx="8" fill="#111827" stroke="#334155"/>
  <text x="283" y="249" class="buttonText">Collection</text>

  <text x="134" y="288" class="label">Type</text>
  <rect x="134" y="300" width="70" height="28" rx="7" fill="#f59e0b"/>
  <text x="155" y="319" class="buttonText">Hero</text>
  <rect x="210" y="300" width="70" height="28" rx="7" fill="#111827" stroke="#334155"/>
  <text x="229" y="319" class="buttonText">Grid</text>
  <rect x="286" y="300" width="82" height="28" rx="7" fill="#111827" stroke="#334155"/>
  <text x="306" y="319" class="buttonText">Logo</text>

  <text x="134" y="360" class="label">Search</text>
  <rect x="134" y="372" width="234" height="34" rx="8" fill="#030712" stroke="#334155"/>
  <text x="146" y="394" class="tiny">super mario bros</text>

  <text x="134" y="438" class="label">Sort</text>
  <rect x="134" y="450" width="234" height="30" rx="8" fill="#111827" stroke="#334155"/>
  <text x="146" y="470" class="tiny">Most upvoted</text>

  <text x="134" y="512" class="label">Filters</text>
  <rect x="134" y="524" width="234" height="102" rx="10" fill="#0f172a" stroke="#1f2937"/>
  <text x="148" y="548" class="tiny">[x] Static only</text>
  <text x="148" y="573" class="tiny">[x] NSFW off</text>
  <text x="148" y="598" class="tiny">[x] Humor off</text>

  <rect x="134" y="780" width="112" height="36" rx="9" fill="#0ea5e9"/>
  <text x="173" y="803" class="buttonText">Apply</text>
  <rect x="256" y="780" width="112" height="36" rx="9" fill="#111827" stroke="#334155"/>
  <text x="296" y="803" class="buttonText">Cancel</text>

  <!-- Gallery -->
  <rect x="410" y="180" width="720" height="670" rx="14" fill="#0a1220" stroke="#1f2937"/>
  <text x="434" y="214" class="label">Gallery</text>

  <!-- 4 x 3 thumbnail grid -->
  <g transform="translate(434,236)">
    <!-- row 1 -->
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#1e293b"/>
    <rect x="180" y="0" width="160" height="150" rx="10" fill="#293548"/>
    <rect x="360" y="0" width="160" height="150" rx="10" fill="#334155"/>
    <rect x="540" y="0" width="160" height="150" rx="10" fill="#1f2937" stroke="#22d3ee" stroke-width="3"/>

    <!-- row 2 -->
    <rect x="0" y="170" width="160" height="150" rx="10" fill="#223046"/>
    <rect x="180" y="170" width="160" height="150" rx="10" fill="#273449"/>
    <rect x="360" y="170" width="160" height="150" rx="10" fill="#314055"/>
    <rect x="540" y="170" width="160" height="150" rx="10" fill="#243245"/>

    <!-- row 3 -->
    <rect x="0" y="340" width="160" height="150" rx="10" fill="#1f2d40"/>
    <rect x="180" y="340" width="160" height="150" rx="10" fill="#29384d"/>
    <rect x="360" y="340" width="160" height="150" rx="10" fill="#33465c"/>
    <rect x="540" y="340" width="160" height="150" rx="10" fill="#223248"/>

    <text x="545" y="20" class="cardText">Selected</text>
    <text x="8" y="522" class="tiny">124 results</text>
    <text x="612" y="522" class="tiny">Page 1/6</text>
  </g>

  <!-- Right preview -->
  <rect x="1150" y="180" width="340" height="670" rx="14" fill="#0b1220" stroke="#1f2937"/>
  <text x="1174" y="214" class="label">Live Preview</text>

  <rect x="1174" y="232" width="292" height="200" rx="12" fill="#111827" stroke="#334155"/>
  <rect x="1188" y="246" width="264" height="172" rx="10" fill="#1e3a5f"/>
  <rect x="1248" y="266" width="140" height="132" rx="10" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
  <text x="1200" y="420" class="tiny">Hero background + focused card preview</text>

  <rect x="1174" y="448" width="292" height="136" rx="12" fill="#0f172a" stroke="#1f2937"/>
  <text x="1192" y="476" class="tiny">Resolution: 3840 x 1240</text>
  <text x="1192" y="500" class="tiny">Score: +184</text>
  <text x="1192" y="524" class="tiny">Author: pixelmeister</text>
  <text x="1192" y="548" class="tiny">Format: static png</text>

  <rect x="1174" y="604" width="140" height="36" rx="9" fill="#f59e0b"/>
  <text x="1204" y="627" class="buttonText">Set Cover</text>
  <rect x="1326" y="604" width="140" height="36" rx="9" fill="#0ea5e9"/>
  <text x="1351" y="627" class="buttonText">Set Background</text>

  <rect x="1174" y="650" width="292" height="36" rx="9" fill="#111827" stroke="#334155"/>
  <text x="1262" y="673" class="buttonText">Open in SteamGridDB</text>

  <!-- Footer controls -->
  <rect x="110" y="866" width="1380" height="52" rx="12" fill="#0b1220" stroke="#1f2937"/>
  <text x="138" y="897" class="hintText">B Back</text>
  <text x="250" y="897" class="hintText">X Clear</text>
  <text x="365" y="897" class="hintText">Y Favorite</text>
  <text x="505" y="897" class="hintText">A Apply Selection</text>
  <text x="1290" y="897" class="tiny">Keyboard: Enter apply, Esc close</text>
</svg>
