name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate versions match tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($pkg -ne $expected) {
            throw "package.json version '$pkg' does not match tag '$tag'."
          }
          if ($tauri -ne $expected) {
            throw "src-tauri/tauri.conf.json version '$tauri' does not match tag '$tag'."
          }

          Write-Host "Version check passed: $expected"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux-steamdeck:
    name: Build Linux (Steam Deck)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate versions match tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")

          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "package.json version '$PKG_VERSION' does not match tag '$TAG'"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$EXPECTED" ]; then
            echo "src-tauri/tauri.conf.json version '$TAURI_VERSION' does not match tag '$TAG'"
            exit 1
          fi

          echo "Version check passed: $EXPECTED"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload Steam Deck artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-build-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
