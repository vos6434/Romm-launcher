name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate versions match tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($pkg -ne $expected) {
            throw "package.json version '$pkg' does not match tag '$tag'."
          }
          if ($tauri -ne $expected) {
            throw "src-tauri/tauri.conf.json version '$tauri' does not match tag '$tag'."
          }

          Write-Host "Version check passed: $expected"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.ref_name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux-steamdeck:
    name: Build Linux (Steam Deck)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            appstream \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Ensure appstream-compose compatibility
        run: |
          if ! command -v appstream-compose >/dev/null 2>&1; then
            if command -v appstreamcli >/dev/null 2>&1; then
              echo '#!/usr/bin/env bash' | sudo tee /usr/bin/appstream-compose >/dev/null
              echo 'exec appstreamcli compose "$@"' | sudo tee -a /usr/bin/appstream-compose >/dev/null
              sudo chmod +x /usr/bin/appstream-compose
            else
              echo "Missing both appstream-compose and appstreamcli"
              exit 1
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate versions match tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")

          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "package.json version '$PKG_VERSION' does not match tag '$TAG'"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$EXPECTED" ]; then
            echo "src-tauri/tauri.conf.json version '$TAURI_VERSION' does not match tag '$TAG'"
            exit 1
          fi

          echo "Version check passed: $EXPECTED"

      - name: Install frontend dependencies
        run: npm ci

      - name: Diagnose built frontend entry paths
        run: |
          npm run build
          echo "--- dist/index.html ---"
          sed -n '1,40p' dist/index.html

      - name: Build Tauri app (Linux)
        env:
          NO_STRIP: "1"
        run: npm run tauri build -- --bundles appimage,deb

      - name: Generate Linux build metadata
        run: |
          mkdir -p src-tauri/target/release/bundle/metadata
          APPIMAGE_PATH=$(ls -1 src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          DEB_PATH=$(ls -1 src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          {
            echo "commit_sha=${{ github.sha }}"
            echo "ref_name=${{ github.ref_name }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "appimage_file=$(basename "$APPIMAGE_PATH")"
            echo "deb_file=$(basename "$DEB_PATH")"
          } > src-tauri/target/release/bundle/metadata/build-info.txt
          sha256sum "$APPIMAGE_PATH" "$DEB_PATH" > src-tauri/target/release/bundle/metadata/checksums.sha256

      - name: Package raw Linux binary
        run: |
          mkdir -p src-tauri/target/release/raw
          cp src-tauri/target/release/tauri-app src-tauri/target/release/raw/
          cp src-tauri/target/release/bundle/metadata/build-info.txt src-tauri/target/release/raw/
          tar -C src-tauri/target/release/raw -czf src-tauri/target/release/raw/tauri-app-${{ github.sha }}.tar.gz tauri-app build-info.txt

      - name: Build Flatpak
        env:
          FLATPAK_SKIP_DEB_BUILD: "1"
        run: bash scripts/build-flatpak.sh

      - name: Add Flatpak metadata
        run: |
          FLATPAK_PATH=$(ls -1 src-tauri/target/release/bundle/flatpak/*.flatpak | head -n 1)
          {
            echo "flatpak_file=$(basename "$FLATPAK_PATH")"
          } >> src-tauri/target/release/bundle/metadata/build-info.txt
          sha256sum "$FLATPAK_PATH" >> src-tauri/target/release/bundle/metadata/checksums.sha256

      - name: Upload Steam Deck artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-build-${{ github.ref_name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/flatpak/*.flatpak
            src-tauri/target/release/bundle/metadata/build-info.txt
            src-tauri/target/release/bundle/metadata/checksums.sha256

      - name: Upload Steam Deck raw binary
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-raw-binary-${{ github.ref_name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/raw/tauri-app-${{ github.sha }}.tar.gz
