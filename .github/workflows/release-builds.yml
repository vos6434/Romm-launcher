name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($pkg -ne $expected) {
            throw "package.json version '$pkg' does not match tag '$tag'."
          }

          Write-Host "Version check passed: $expected"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        run: npm run build:electron:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.ref_name }}
          path: |
            dist/*.exe

  build-linux-steamdeck:
    name: Build Linux (Steam Deck)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")

          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "package.json version '$PKG_VERSION' does not match tag '$TAG'"
            exit 1
          fi

          echo "Version check passed: $EXPECTED"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Linux)
        run: npm run build:electron:linux

      - name: Upload Steam Deck artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-build-${{ github.ref_name }}
          path: |
            dist/*.AppImage